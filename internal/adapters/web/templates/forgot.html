{{define "content"}}
<h1>Reset your password</h1>
{{if .Sent}}
<p class="notice">If that email is registered, a reset link is on its way.</p>
{{else}}
<p>Enter the email address you use for {{.Tenant.Name}}.</p>
<form method="post" action="/app/{{.Tenant.Slug}}/forgot">
  <p>
    <label for="email">Email</label>
    <input id="email" name="email" type="email" autocomplete="username" required>
  </p>
  <p><button type="submit">Send reset link</button></p>
</form>
{{end}}
<p><a href="/app/{{.Tenant.Slug}}/login">Back to sign in</a></p>
{{end}}
